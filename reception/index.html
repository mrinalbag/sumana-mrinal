<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#140306" />
  <meta name="description" content="The Grand Reception of Sumana & Mrinal — Sunday 22 November 2026, Own House, Ghoradhara, Jhargram" />
  <!-- Pretty WhatsApp/social preview — update og:url & og:image with your own domain & photo after deploy -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Grand Reception — Sumana & Mrinal · 22 November 2026" />
  <meta property="og:description" content="Sunday, 22 November 2026 · 7:00 PM onwards · Own House, Ghoradhara, Jhargram (Near Art Academy)" />
  <meta property="og:image" content="https://charming-liskov-12.preview.emergentagent.com/assets/images/couple-09.webp" />
  <meta property="og:url" content="https://charming-liskov-12.preview.emergentagent.com/reception/" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>The Grand Reception — Sumana &amp; Mrinal · 22 November 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="grain" data-site="reception">

  <!-- Preloader -->
  <div class="preloader" id="preloader" data-testid="preloader">
    <div class="alpana-layer"></div>
    <div class="glow-pulse">
      <svg viewBox="0 0 140 140" class="preloader-draw" fill="none" stroke="#D4AF37" stroke-width="1.1" data-testid="preloader-alpana">
        <circle cx="70" cy="70" r="6"/><circle cx="70" cy="70" r="18" stroke-dasharray="3 8"/>
        <path d="M70 38c8 10 8 24 0 34-8-10-8-24 0-34Z"/><path d="M70 102c8-10 8-24 0-34-8 10-8 24 0 34Z"/>
        <path d="M38 70c10-8 24-8 34 0-10 8-24 8-34 0Z"/><path d="M102 70c-10 8-24 8-34 0 10-8 24-8 34 0Z"/>
        <path d="M47 47c11 3 19 11 22 22-11-3-19-11-22-22Z"/><path d="M93 93c-11-3-19-11-22-22 11 3 19 11 22 22Z"/>
        <path d="M93 47c-3 11-11 19-22 22 3-11 11-19 22-22Z"/><path d="M47 93c3-11 11-19 22-22-3 11-11 19-22 22Z"/>
      </svg>
    </div>
    <p class="preloader-blessing gold-text" data-testid="preloader-blessing">শুভ বিবাহ</p>
    <p class="preloader-line" data-i18n="common.preloaderLine"></p>
    <div class="preloader-bar"><span></span></div>
    <span class="preloader-pct" data-testid="preloader-progress">0%</span>
  </div>

  <!-- Header -->
  <header class="site-header" data-testid="site-header">
    <div class="header-inner">
      <a href="../" class="brand" data-testid="nav-logo">
        <span class="script" data-i18n="common.name1"></span><span class="dot">✦</span><span class="script" data-i18n="common.name2"></span>
      </a>
      <nav class="site-nav">
      <!-- <a href="../" data-testid="nav-home" data-i18n="common.navHome"></a> -->
      <!--  <a href="../wedding/" data-testid="nav-wedding" data-i18n="common.navWedding"></a> -->
        <a href="./" class="active" data-testid="nav-reception" data-i18n="common.navReception"></a>
        <button class="lang-toggle" id="lang-toggle" data-testid="language-toggle">বাংলা</button>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" data-testid="hero-reception">
    <div class="hero-media">
      <video id="hero-video" autoplay muted loop playsinline data-testid="hero-video-reception"></video>
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="eyebrow hero-eyebrow" data-testid="hero-eyebrow-reception" data-i18n-site="label"></p>
      <h1 class="hero-names font-display" data-testid="hero-names-reception">
        <span class="mask d1"><span class="script" data-i18n="common.name1"></span></span>
        <span class="mask d2"><span><span class="gold-text joiner" data-i18n="common.joiner"></span> <span class="script gold-text" data-i18n="common.name2"></span></span></span>
      </h1>
      <div class="hero-meta">
        <p class="hero-date" data-testid="hero-date-reception"><span data-i18n-site="heroDate"></span> — <span data-i18n-site="heroTime"></span></p>
        <p class="hero-venue" data-testid="hero-venue-reception" data-i18n-site="heroVenue"></p>
        <p class="hero-invite"><span data-i18n="common.together"></span> · <span data-i18n="common.request"></span></p>
      </div>
      <div class="countdown" id="countdown" data-testid="countdown">
        <div class="cd-unit" data-cd="days"><div class="cd-box"><span class="cd-value" data-testid="countdown-days">00</span></div><span class="cd-label" data-i18n="common.cdDays"></span></div>
        <span class="cd-sep">·</span>
        <div class="cd-unit" data-cd="hours"><div class="cd-box"><span class="cd-value" data-testid="countdown-hours">00</span></div><span class="cd-label" data-i18n="common.cdHours"></span></div>
        <span class="cd-sep">·</span>
        <div class="cd-unit" data-cd="minutes"><div class="cd-box"><span class="cd-value" data-testid="countdown-minutes">00</span></div><span class="cd-label" data-i18n="common.cdMinutes"></span></div>
        <span class="cd-sep">·</span>
        <div class="cd-unit" data-cd="seconds"><div class="cd-box"><span class="cd-value" data-testid="countdown-seconds">00</span></div><span class="cd-label" data-i18n="common.cdSeconds"></span></div>
      </div>
      <div class="scroll-cue">
        <span data-i18n="common.scroll"></span>
        <span class="cue-track"><span class="cue-dot" style="display:block"></span></span>
      </div>
    </div>
  </section>

  <!-- Marquee -->
  <div class="marquee" data-testid="editorial-marquee"><div class="marquee-track"></div></div>

  <!-- Chapters -->
  <div class="chapters">
    <div class="alpana-layer"></div>

    <section class="chapter center" data-testid="chapter-story-reception">
      <div class="reveal">
        <p class="chapter-no" data-i18n-site="storyNo"></p>
        <h2 class="chapter-title script" data-i18n-site="storyTitle"></h2>
        <div class="ornament">✦ ❋ ✦</div>
        <p class="chapter-body" data-i18n-site="storyBody"></p>
      </div>
    </section>

    <section class="chapter" data-testid="chapter-ceremonies-reception">
      <div class="reveal">
        <p class="chapter-no" data-i18n-site="cerNo"></p>
        <h2 class="chapter-title script" data-i18n-site="cerTitle"></h2>
        <div class="chapter-rule"></div>
      </div>
      <div class="ceremony-grid">
        <article class="gilded-card ceremony-card reveal" data-testid="ceremony-card-reception-0">
          <h3 class="script" data-i18n-site="cer1Name"></h3>
          <p data-i18n-site="cer1Note"></p>
          <p class="ceremony-time">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span data-i18n-site="cer1Time"></span>
          </p>
        </article>
        <article class="gilded-card ceremony-card reveal" style="--d:.12s" data-testid="ceremony-card-reception-1">
          <h3 class="script" data-i18n-site="cer2Name"></h3>
          <p data-i18n-site="cer2Note"></p>
          <p class="ceremony-time">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span data-i18n-site="cer2Time"></span>
          </p>
        </article>
      </div>
    </section>

    <section class="chapter" data-testid="chapter-venue-reception">
      <div class="reveal">
        <p class="chapter-no" data-i18n-site="venNo"></p>
        <h2 class="chapter-title script" data-i18n-site="venTitle"></h2>
        <div class="chapter-rule"></div>
      </div>
      <div class="gilded-card venue-card reveal" style="--d:.1s">
        <div>
          <h3 class="script" data-testid="venue-name-reception" data-i18n-site="venName"></h3>
          <address data-i18n-site="venAddr1"></address>
          <address data-i18n-site="venAddr2"></address>
          <p class="venue-note" data-i18n-site="venNote"></p>
        </div>
        <a class="map-btn" id="venue-map-btn" data-testid="venue-map-reception" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span data-i18n="common.viewMap"></span>
        </a>
      </div>
      <div class="venue-map reveal" style="--d:.15s">
        <iframe id="venue-map-frame" data-testid="venue-map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Venue location map"></iframe>
      </div>
    </section>
  </div>

  <!-- Marquee -->
  <div class="marquee"><div class="marquee-track"></div></div>

  <!-- Gallery -->
  <section class="gallery-section" data-testid="gallery-section">
    <div class="gallery-head reveal">
      <p class="chapter-no" data-i18n="common.galleryNo"></p>
      <h2 class="chapter-title script" data-testid="gallery-title" data-i18n="common.galleryTitle"></h2>
      <p class="sub" data-i18n="common.gallerySub"></p>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>

  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" data-testid="lightbox">
    <button class="lb-btn lb-close" id="lb-close" data-testid="lightbox-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lb-prev" data-testid="lightbox-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img id="lb-image" data-testid="lightbox-image" alt="" />
    <button class="lb-btn lb-next" id="lb-next" data-testid="lightbox-next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span class="lb-counter" id="lb-counter" data-testid="lightbox-counter"></span>
  </div>

  <!-- Footer -->
  <footer class="site-footer" data-testid="site-footer">
    <div class="alpana-layer"></div>
    <div class="footer-inner">
      <div class="ornament">✦ ❋ ✦</div>
      <p class="footer-names"><span class="script" data-i18n="common.name1"></span> <span class="gold-text" data-i18n="common.joiner"></span> <span class="script" data-i18n="common.name2"></span></p>
      <p class="footer-line" data-i18n="common.footerLine"></p>
      <p class="footer-hashtag" data-i18n="common.hashtag"></p>
      <div class="share-row">
        <a class="wa-btn wa-share" data-testid="wa-share-reception" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          <span>Share this invitation</span>
        </a>
      </div>
      <div class="footer-links">
        <a href="../" data-testid="footer-home-link" data-i18n="common.backHome"></a>
        <a href="../wedding/" class="gold" data-testid="footer-other-event-link"><span data-i18n-site="otherEvent"></span> →</a>
      </div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/countdown.js"></script>
  <script src="../js/gallery.js"></script>
</body>
</html>
